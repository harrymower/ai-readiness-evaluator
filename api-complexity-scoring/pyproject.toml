[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-complexity-scoring"
version = "0.1.0"
description = "A standalone tool for scoring API complexity using LLMs"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "Harry Mower", email = "harry@example.com"},
]
dependencies = [
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "openai>=1.0.0",
  "google-generativeai>=0.3.0",
  "anthropic>=0.3.0",
  "beautifulsoup4>=4.12.0",
  "requests>=2.31.0",
  "pyyaml>=6.0.0",
  "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-mock>=3.12.0",
]

[project.urls]
Homepage = "https://github.com/harrymower/ai-readiness-evaluator"

[tool.hatch.build.targets.wheel]
packages = ["src/api_analysis"]
