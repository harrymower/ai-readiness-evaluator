# API Metadata for Complexity Analysis
# This file contains service-level metadata for all APIs tested in apis.txt
# Used for bucketing APIs by complexity signals

# Complexity Signals (Phase 0.1):
# - auth_required: Does the API require authentication? (yes/no/optional)
# - pagination_supported: Does the API support pagination? (yes/no/unknown)
# - total_endpoints: Total number of endpoints in the API service
# - schema_depth: Maximum nesting depth of response JSON (shallow/medium/deep)
# - avg_response_size_kb: Average response size in kilobytes (estimated)
# - error_surface: Variety of error codes/scenarios (low/medium/high)

# Additional Complexity Signals (Phase 0.1.0.1):
# - parameter_complexity: Typical request parameter complexity (low/medium/high/unknown)
# - pagination_pattern: Primary pagination mechanism (none/offset_limit/page_size/cursor/mixed/other/unknown)
# - rate_limiting: Rate-limiting complexity (none/simple/complex/unknown)
# - doc_coverage: Documentation quality (low/medium/high/unknown)
# - error_codes_count: Approximate number of distinct error status codes (integer)

